name: security-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Terraform and Kubernetes manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes
          soft_fail: false
          skip_check: CKV_K8S_43,CKV_K8S_40,CKV_AZURE_170,CKV_AZURE_4,CKV_AZURE_172,CKV_AZURE_141,CKV_AZURE_116,CKV_AZURE_115,CKV_AZURE_6,CKV_AZURE_226,CKV_AZURE_117,CKV_AZURE_227,CKV_AZURE_232
